# Unofficial fork build; reuses the pinned upstream LKM, ksuinit and ksud workflows.
name: Build ChunianSU

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chuniansu-${{ github.ref }}
  cancel-in-progress: false

jobs:
  certificate:
    runs-on: ubuntu-latest
    outputs:
      expected_size: ${{ steps.cert.outputs.expected_size }}
      expected_hash: ${{ steps.cert.outputs.expected_hash }}
    steps:
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - name: Export the persistent signing certificate (never a temporary signing identity)
        id: cert
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE }}
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        shell: bash
        run: |
          set -euo pipefail
          : "${KEYSTORE_B64:?Set the KEYSTORE repository secret}"
          : "${STORE_PASSWORD:?Set the KEYSTORE_PASSWORD repository secret}"
          : "${KEY_ALIAS:?Set the KEY_ALIAS repository secret}"
          umask 077
          key="$RUNNER_TEMP/chuniansu-cert-key.jks"
          cert="$RUNNER_TEMP/chuniansu-cert.der"
          trap 'rm -f "$key" "$cert"' EXIT
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$key"
          keytool -exportcert -keystore "$key" -alias "$KEY_ALIAS" \
            -storepass:env STORE_PASSWORD -file "$cert"
          printf 'expected_size=0x%04x\n' "$(stat -c%s "$cert")" >> "$GITHUB_OUTPUT"
          printf 'expected_hash=%s\n' "$(sha256sum "$cert" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

  build-lkm:
    needs: certificate
    uses: ./.github/workflows/build-lkm.yml
    with:
      expected_size: ${{ needs.certificate.outputs.expected_size }}
      expected_hash: ${{ needs.certificate.outputs.expected_hash }}
      manager_package: me.weishu.chuniansu

  build-ksuinit:
    uses: ./.github/workflows/ksuinit.yml

  build-ksud:
    needs: [build-lkm, build-ksuinit]
    strategy:
      matrix:
        target: [aarch64-linux-android, x86_64-linux-android]
    uses: ./.github/workflows/ksud.yml
    with:
      target: ${{ matrix.target }}
      pack_lkm: true
      pack_ksuinit: true

  build-manager:
    needs: certificate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check the customization
        run: python3 tools/chuniansu/check.py
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      - name: Build the manager with the persistent key
        working-directory: manager
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE }}
          ORG_GRADLE_PROJECT_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          ORG_GRADLE_PROJECT_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          ORG_GRADLE_PROJECT_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          : "${ORG_GRADLE_PROJECT_KEY_PASSWORD:?Set the KEY_PASSWORD repository secret}"
          umask 077
          key="$RUNNER_TEMP/chuniansu-manager-key.jks"
          trap 'rm -f "$key"' EXIT
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$key"
          export ORG_GRADLE_PROJECT_KEYSTORE_FILE="$key"
          ./gradlew --no-daemon assembleRelease
      - uses: actions/upload-artifact@v7
        with:
          name: chuniansu-gradle
          path: manager/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: chuniansu-mappings
          path: manager/app/build/outputs/mapping/release/
          if-no-files-found: error

  repack-manager:
    needs: [certificate, build-manager, build-ksud]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - name: Install the pinned Android build tools
        shell: bash
        run: |
          set -euo pipefail
          sdk="${ANDROID_SDK_ROOT:-${ANDROID_HOME:?Android SDK not present on this runner}}"
          "$sdk/cmdline-tools/latest/bin/sdkmanager" "build-tools;37.0.0"
      - uses: actions/download-artifact@v8
        with:
          name: chuniansu-gradle
          path: artifacts/manager-gradle
      - uses: actions/download-artifact@v8
        with:
          name: ksud-aarch64-linux-android
          path: artifacts/ksud-arm64
      - uses: actions/download-artifact@v8
        with:
          name: ksud-x86_64-linux-android
          path: artifacts/ksud-x64
      - name: Place the Gradle APK and both rebuilt daemons
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from shutil import copy2
          def copy_one(source, pattern, destination):
              files = list(Path(source).rglob(pattern))
              if len(files) != 1:
                  raise SystemExit(f"Expected one {pattern} under {source}, found {len(files)}")
              out = Path(destination)
              out.mkdir(parents=True, exist_ok=True)
              copy2(files[0], out / files[0].name)
          copy_one('artifacts/manager-gradle', '*.apk', 'manager/app/build/outputs/apk/release')
          copy_one('artifacts/ksud-arm64', 'ksud', 'target/aarch64-linux-android/release')
          copy_one('artifacts/ksud-x64', 'ksud', 'target/x86_64-linux-android/release')
          PY
      - name: Repack both daemons and their matching LKM payloads, then sign
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          key="$RUNNER_TEMP/chuniansu-repack-key.jks"
          trap 'rm -f "$key"' EXIT
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$key"
          python3 repack_apk.py repack -b release -t release \
            -a arm64-v8a -a x86_64 \
            -K "$key" -A "$KEY_ALIAS" \
            -P "$KEYSTORE_PASSWORD" -S "$KEY_PASSWORD" --strip
      - name: Verify final APK identity, certificate and daemon payloads
        env:
          EXPECTED_CERT: ${{ needs.certificate.outputs.expected_hash }}
        run: python3 tools/chuniansu/verify_apk.py --apk-dir dist --expected-cert "$EXPECTED_CERT"
      - name: Upload the FINAL APK (not the intermediate Gradle artifact)
        uses: actions/upload-artifact@v7
        with:
          name: ChunianSU
          path: |
            dist/*.apk
            dist/*.sha256
            dist/BUILD_INFO.json
          if-no-files-found: error
